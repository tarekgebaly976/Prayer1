[project]
name = "papermill-cmms"
version = "0.1.0"
description = "Paper Mill CMMS Cloud - backend API and worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "apscheduler>=3.10,<4",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "python-multipart>=0.0.9",
  "qrcode[pil]>=7.4",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "B008", "S311", "UP042", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/seed.py" = ["S105", "S106"]
"alembic/*" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
