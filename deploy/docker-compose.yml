# Reproducible stack: PostgreSQL, migration job, API, background worker, web, and Caddy (TLS).
# Usage: cp deploy/.env.example deploy/.env && edit secrets && docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: papermill-cmms

x-api-env: &api-env
  CMMS_ENVIRONMENT: ${CMMS_ENVIRONMENT:-development}
  CMMS_DATABASE_URL: postgresql+psycopg://cmms_app:${CMMS_APP_DB_PASSWORD}@db:5432/cmms
  CMMS_MIGRATION_DATABASE_URL: postgresql+psycopg://cmms_owner:${CMMS_OWNER_DB_PASSWORD}@db:5432/cmms
  CMMS_COOKIE_SECURE: "true"
  CMMS_STORAGE_BACKEND: ${CMMS_STORAGE_BACKEND:-local}
  CMMS_STORAGE_LOCAL_PATH: /app/var/storage
  CMMS_S3_BUCKET: ${CMMS_S3_BUCKET:-}
  CMMS_S3_REGION: ${CMMS_S3_REGION:-}
  CMMS_SMTP_HOST: ${CMMS_SMTP_HOST:-}
  CMMS_SMTP_PORT: ${CMMS_SMTP_PORT:-587}
  CMMS_SMTP_USER: ${CMMS_SMTP_USER:-}
  CMMS_SMTP_PASSWORD: ${CMMS_SMTP_PASSWORD:-}
  CMMS_SMTP_FROM: ${CMMS_SMTP_FROM:-}

services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cmms
      POSTGRES_USER: cmms_owner
      POSTGRES_PASSWORD: ${CMMS_OWNER_DB_PASSWORD:?set CMMS_OWNER_DB_PASSWORD}
      CMMS_APP_DB_PASSWORD: ${CMMS_APP_DB_PASSWORD:?set CMMS_APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmms_owner -d cmms"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: papermill-cmms-api
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: papermill-cmms-api
    build: ../backend
    restart: unless-stopped
    environment: *api-env
    volumes:
      - storage:/app/var/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    image: papermill-cmms-api
    build: ../backend
    command: ["python", "-m", "app.worker"]
    healthcheck: { disable: true }  # background jobs only; the image's check probes the web API
    restart: unless-stopped
    environment: *api-env
    volumes:
      - storage:/app/var/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: papermill-cmms-web
    build: ../frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CMMS_DOMAIN: ${CMMS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]
    # "edge" also reaches the optional test copy (deploy/docker-compose.test.yml) at test.<domain>.
    networks: [default, edge]

networks:
  default: {}
  edge:
    name: papermill-cmms-edge

volumes:
  pgdata:
  storage:
  caddy_data:
